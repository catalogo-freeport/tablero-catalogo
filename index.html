<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avance de produccion - Catalogo modelo IA</title>
<style>
  :root{--bg:#16181d;--panel:#1e2128;--panel-2:#252932;--line:#333844;--ink:#eceef2;--ink-dim:#9aa1ad;--ink-faint:#6b7280;--done:#6fae7a;--done-bg:#1f2d24;--pending:#c8923f;--accent:#7c9cc4;--radius:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:28px 20px 80px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:980px;margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .gen{font-size:12px;color:var(--ink-faint);margin-top:4px;}

  .globals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 24px;}
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.15s;}
  .gcard:hover{border-color:var(--accent);}
  .gcard.active{border-color:var(--accent);background:var(--panel-2);}
  .gcard-label{font-size:12px;color:var(--ink-dim);font-weight:600;display:block;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gcard-num{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .gcard-num .of{color:var(--ink-faint);font-weight:500;font-size:14px;}
  .gcard-pend{font-size:11px;color:var(--pending);font-weight:600;margin-top:4px;}
  .gcard-pend.zero{color:var(--done);}
  .gcard .bar{margin-top:10px;}

  .bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--done),#8bc196);border-radius:99px;transition:width .4s ease;}
  .vista-label{font-size:12px;color:var(--ink-faint);margin-bottom:14px;}
  .brands{display:flex;flex-direction:column;gap:14px;}
  .brand{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .brand-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none;}
  .brand-head:hover{background:var(--panel-2);}
  .brand-name{font-size:16px;font-weight:600;flex:1;}
  .brand-mini{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;display:grid;grid-template-columns:84px 170px 90px;align-items:center;gap:10px;flex-shrink:0;}
  .pill{padding:3px 9px;border-radius:99px;font-weight:600;font-size:11px;text-align:center;white-space:nowrap;}
  .brand-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill.complete{background:var(--done-bg);color:var(--done);}
  .pill.partial{background:#2b2620;color:var(--pending);}
  .brand-bar{width:90px;height:5px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
  .brand-bar span{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s;}
  .chevron{color:var(--ink-faint);font-size:12px;transition:transform .2s;}
  .brand.open .chevron{transform:rotate(90deg);}
  .lots{display:none;padding:4px 12px 14px;gap:8px;flex-wrap:wrap;}
  .brand.open .lots{display:flex;}
  .lot{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;font-size:13px;cursor:pointer;overflow:hidden;width:100%;max-width:320px;}
  .lot-head{display:flex;align-items:center;gap:9px;padding:9px 13px;}
  .lot.done{background:var(--done-bg);border-color:#2f4a37;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--pending);flex-shrink:0;}
  .lot.done .status-dot{background:var(--done);}
  .lot-name{font-weight:500;}
  .lot.done .lot-name{color:var(--done);}
  .check{margin-left:4px;font-size:12px;color:var(--ink-faint);}
  .lot.done .check{color:var(--done);}
  .arch{font-size:11px;opacity:.7;margin-left:2px;}
  .lot.arch-lot{border-style:dashed;}
  .lot-chevron{color:var(--ink-faint);font-size:10px;transition:transform .2s;margin-left:auto;flex-shrink:0;}
  .lot.lot-open .lot-chevron{transform:rotate(90deg);}
  .lot-detail{display:none;flex-direction:column;gap:6px;padding:8px 13px 12px;border-top:1px solid var(--line);}
  .lot.lot-open .lot-detail{display:flex;}
  .phase-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;}
  .phase-name{color:var(--ink-dim);}
  .phase-val{color:var(--ink-faint);white-space:nowrap;}
  .phase-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .phase-badge.done{background:var(--done-bg);color:var(--done);}
  .phase-badge.pending{background:#2b2620;color:var(--pending);}
  .empty{color:var(--ink-faint);font-size:14px;padding:30px;text-align:center;font-style:italic;}
  footer{margin-top:40px;font-size:11px;color:var(--ink-faint);text-align:center;}
  @media(max-width:560px){
    .globals{grid-template-columns:repeat(2,1fr);}
    .brand-mini{grid-template-columns:76px 150px;}
    .brand-mini .brand-bar{display:none;}
    h1{font-size:19px;}
    .gcard-num{font-size:18px;}
    .lot{max-width:100%;}
  }
  @media(max-width:480px){
    .globals{grid-template-columns:repeat(2,1fr);gap:8px;}
    .gcard{padding:12px;}
    .brand-head{flex-wrap:wrap;row-gap:8px;}
    .brand-name{flex:1 1 100%;}
    .brand-mini{width:100%;grid-template-columns:76px 1fr 64px;}
    .brand-mini .brand-bar{display:block;width:64px;}
  }

  .ms-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .ms-modal.open{display:flex;}
  .ms-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;}
  .ms-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:13px;color:var(--ink-dim);}
  .ms-close{background:none;border:none;color:var(--ink-faint);font-size:15px;cursor:pointer;line-height:1;padding:2px 6px;}
  .ms-close:hover{color:var(--ink);}
  .ms-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
  .ms-info button{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;}
  .ms-grid{display:grid;grid-template-columns:repeat(9,26px);grid-template-rows:repeat(9,26px);gap:2px;}
  .ms-cell{width:26px;height:26px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;border-radius:3px;}
  .ms-cell.revealed{background:var(--bg);cursor:default;}
  .ms-cell.mine{background:#4a1f1f;}
  .ms-cell.n1{color:#7c9cc4;}
  .ms-cell.n2{color:var(--done);}
  .ms-cell.n3{color:#d97a6a;}
  .ms-cell.n4{color:#a48ce0;}
  .ms-cell.n5{color:#c8923f;}
  .ms-cell.n6{color:#6fc1c9;}
  .ms-cell.n7{color:var(--ink);}
  .ms-cell.n8{color:var(--ink-faint);}

  .pac-grid{display:grid;gap:0;background:#000;border-radius:4px;overflow:hidden;}
  .pac-cell{width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
  .pac-cell.wall{background:#1a2a4a;}
  .pac-dot{width:3px;height:3px;background:#e8c46a;border-radius:50%;display:block;}
  .pac-power{width:7px;height:7px;background:#e8c46a;border-radius:50%;display:block;}
  .pac-man{color:#f5d76e;font-size:11px;line-height:1;}
  .pac-ghost{font-size:12px;line-height:1;}
  .pac-controls{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px;}
  .pac-controls > div{display:flex;gap:4px;}
  .pac-btn{width:32px;height:32px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:16px;cursor:pointer;}
  .pac-btn:hover{border-color:var(--accent);}
</style>
</head>

let vista = "general"; // controla que fase se resalta en la lista de marcas/lotes
let openBrands = new Set();
let openLots = new Set();

const LABELS = {
  general: "Click en una marca para ver sus lotes. Click en un lote para ver el detalle de Final / Modelo / Modelo video. Un lote queda listo cuando se mueve a la carpeta \"B. LISTO CON IA\".",
  final: "Resaltando Final: listo cuando el lote esta dentro de \"B. LISTO CON IA\".",
  modelo: "Resaltando Modelo: listo cuando el lote esta dentro de \"B. LISTO CON IA\".",
  video: "Resaltando Modelo video: listo cuando el lote esta dentro de \"B. LISTO CON IA\"."
};
const PHASE_LABEL = {final:"Final (fotos)", modelo:"Modelo", video:"Modelo video"};
const PHASE_UNIT = {final:"fotos", modelo:"archivos", video:"videos"};

function loteListo(l, v){
  if(v==="general") return l.final && l.modelo && l.video;
  return !!l[v];
}

function fmt(iso){
  if(!iso) return "";
  try{ return new Date(iso).toLocaleString("es-CO",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return ""; }
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderGlobals(){
  ["general","final","modelo","video"].forEach(v=>{
    let total=0, done=0;
    DATA.marcas.forEach(b=>b.lots.forEach(l=>{
      const n=l.n_referencias||0;
      total+=n;
      if(loteListo(l,v)) done+=n;
    }));
    const pend = total-done;
    document.getElementById("done-"+v).textContent = done;
    document.getElementById("total-"+v).textContent = total;
    document.getElementById("bar-"+v).style.width = total ? (done/total*100)+"%" : "0%";
    const pendEl = document.getElementById("pend-"+v);
    pendEl.textContent = pend>0 ? ("Faltan "+pend+" referencia"+(pend===1?"":"s")) : "Completo";
    pendEl.classList.toggle("zero", pend===0);
  });
  document.querySelectorAll(".gcard").forEach(c=>c.classList.toggle("active", c.dataset.v===vista));
}

function renderBrands(){
  document.getElementById("vistaLabel").textContent = LABELS[vista];
  const wrap = document.getElementById("brands");
  wrap.innerHTML = "";
  DATA.marcas.forEach((b,bi)=>{
    const t=b.lots.reduce((s,l)=>s+(l.n_referencias||0),0);
    const d=b.lots.reduce((s,l)=>s+(loteListo(l,vista)?(l.n_referencias||0):0),0);
    const pend=t-d, comp=t>0&&d===t, pct=t?(d/t*100):0;
    const el=document.createElement("div");
    el.className="brand"+(openBrands.has(b.name)?" open":"");
    el.innerHTML=
      '<div class="brand-head" data-b="'+bi+'">'+
        '<span class="chevron">&#9654;</span>'+
        '<span class="brand-name">'+esc(b.name)+'</span>'+
        '<span class="brand-mini">'+
          '<span class="pill '+(comp?"complete":"partial")+'">'+(comp?"Completa":"van "+d+"/"+t)+'</span>'+
          (t===0?'<span class="brand-status">sin referencias</span>':(pend>0?'<span class="brand-status">faltan '+pend+' referencia'+(pend===1?'':'s')+'</span>':'<span class="brand-status">&#10003; listo</span>'))+
          '<span class="brand-bar"><span style="width:'+pct+'%"></span></span>'+
        '</span>'+
      '</div>'+
      '<div class="lots">'+
        b.lots.map((l,li)=>{
          const lotKey=b.name+"||"+l.lote+"||"+li;
          const ok=loteListo(l,vista);
          const isOpen=openLots.has(lotKey);
          const tag = l.archivado ? ' <span class="arch">&#9729;</span>' : '';
          const nRef = l.n_referencias||0;
          const miniDetalle = l.archivado ? "en Dropbox" : nRef+" referencia"+(nRef===1?"":"s");

          let detail;
          if(l.archivado){
            detail = '<div class="lot-detail"><div class="phase-row">'+
              '<span class="phase-name">Estado</span>'+
              '<span class="phase-badge done">En Dropbox — completado</span>'+
            '</div></div>';
          } else {
            detail = '<div class="lot-detail">'+
              '<div class="phase-row">'+
                '<span class="phase-name">Referencias</span>'+
                '<span class="phase-val">'+nRef+'</span>'+
                '<span class="phase-badge '+(ok?"done":"pending")+'">'+(ok?"Listo":"Pendiente")+'</span>'+
              '</div>'+
              ["final","modelo","video"].map(v=>{
                const okv=!!l[v];
                const n = v==="final"?l.n_final:(v==="modelo"?l.n_modelo:l.n_video);
                const nTxt = (n!=null?n:0)+" "+PHASE_UNIT[v];
                return '<div class="phase-row">'+
                  '<span class="phase-name">'+PHASE_LABEL[v]+'</span>'+
                  '<span class="phase-val">'+nTxt+'</span>'+
                  '<span class="phase-badge '+(okv?"done":"pending")+'">'+(okv?"Listo":"Pendiente")+'</span>'+
                '</div>';
              }).join("")+
              '</div>';
          }

          return '<div class="lot '+(ok?"done":"")+(l.archivado?" arch-lot":"")+(isOpen?" lot-open":"")+'" data-lk="'+esc(lotKey)+'">'+
            '<div class="lot-head">'+
              '<span class="status-dot"></span>'+
              '<span class="lot-name">'+esc(l.lote)+tag+'</span>'+
              '<span class="check">'+(ok?("&#10003; "+(l.archivado?"en Dropbox":"listo")):miniDetalle)+'</span>'+
              '<span class="lot-chevron">&#9654;</span>'+
            '</div>'+
            detail+
          '</div>';
        }).join("")+
      '</div>';
    wrap.appendChild(el);
  });

  wrap.querySelectorAll(".brand-head").forEach(h=>
    h.addEventListener("click",()=>{
      const b=DATA.marcas[+h.dataset.b];
      if(openBrands.has(b.name)) openBrands.delete(b.name); else openBrands.add(b.name);
      renderBrands();
    }));

  wrap.querySelectorAll(".lot").forEach(el=>
    el.addEventListener("click",()=>{
      const key = el.dataset.lk;
      if(openLots.has(key)) openLots.delete(key); else openLots.add(key);
      renderBrands();
    }));
}

  if(!DATA || !DATA.marcas){
    document.getElementById("brands").innerHTML='<div class="empty">No se pudo leer la carpeta de Productos. Corre el actualizador o revisa la ruta.</div>';

  document.getElementById("gen").textContent = "Ultimo cambio detectado: " + fmt(DATA.generado) + "  ·  el sistema revisa tus carpetas cada 2 minutos automaticamente";

const PAC_ROWS = 13, PAC_COLS = 17;
const PAC_MAZE_BASE = [
  "#################",
  "#.......#.......#",
  "#.###.#.#.#.###.#",
  "#.#...#.#.#...#.#",
  "#.#.###.#.###.#.#",
  "#...............#",
  "#.###.#####.###.#",
  "#.#.......#...#.#",
  "#.#.#####.#.#.#.#",
  "#...........#...#",
  "#.###.#.#.###.#.#",
  "#.......#.......#",
  "#################"
];
const PAC_POWER_CELLS = [[1,1],[1,15],[11,1],[11,15]];

let pacGrid, pacX, pacY, pacDir, pacNextDir, pacGhosts, pacScore, pacFin, pacPoder, pacPoderHasta, pacIntervalo, pacDots;

function pacAbrir(){
  document.getElementById("pacModal").classList.add("open");
  document.addEventListener("keydown", pacTecla);
  pacIniciar();
}
function pacCerrar(){
  clearInterval(pacIntervalo);
  document.getElementById("pacModal").classList.remove("open");
  document.removeEventListener("keydown", pacTecla);
}
document.getElementById("pacClose").addEventListener("click", pacCerrar);
document.getElementById("pacModal").addEventListener("click", e=>{
  if(e.target.id === "pacModal") pacCerrar();
});
document.getElementById("pacReset").addEventListener("click", pacIniciar);
document.getElementById("pacUp").addEventListener("click", ()=>pacMover(0,-1));
document.getElementById("pacDown").addEventListener("click", ()=>pacMover(0,1));
document.getElementById("pacLeft").addEventListener("click", ()=>pacMover(-1,0));
document.getElementById("pacRight").addEventListener("click", ()=>pacMover(1,0));

function pacTecla(e){
  const map = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}};
  if(map[e.key]){ e.preventDefault(); pacNextDir = map[e.key]; }
}
function pacMover(dx,dy){ pacNextDir = {x:dx,y:dy}; }

function pacLibre(x,y){
  if(y<0||y>=PAC_ROWS) return false;
  const xx = (x+PAC_COLS)%PAC_COLS;
  return pacGrid[y][xx] !== "#";
}

function pacIniciar(){
  clearInterval(pacIntervalo);
  pacGrid = PAC_MAZE_BASE.map(row=>row.split(""));
  pacDots = 0;
  for(let y=0;y<PAC_ROWS;y++) for(let x=0;x<PAC_COLS;x++) if(pacGrid[y][x]===".") pacDots++;
  PAC_POWER_CELLS.forEach(([y,x])=>{ pacGrid[y][x]="o"; });
  pacX=8; pacY=9; pacDir={x:0,y:0}; pacNextDir={x:0,y:0};
  pacGhosts=[
    {x:7,y:5,color:"#e05a5a"},
    {x:8,y:5,color:"#e08ac9"},
    {x:9,y:5,color:"#6fc1c9"}
  ];
  pacScore=0; pacFin=false; pacPoder=false; pacPoderHasta=0;
  document.getElementById("pacScore").textContent="Puntos: 0";
  document.getElementById("pacMsg").textContent="";
  pacPintar();
  pacIntervalo = setInterval(pacTick, 220);
}

function pacTick(){
  if(pacFin) return;
  if(pacLibre(pacX+pacNextDir.x, pacY+pacNextDir.y)){ pacDir = pacNextDir; }
  if(pacLibre(pacX+pacDir.x, pacY+pacDir.y)){
    pacX = (pacX+pacDir.x+PAC_COLS)%PAC_COLS;
    pacY = pacY+pacDir.y;
  }
  const cell = pacGrid[pacY][pacX];
  if(cell==="."){ pacGrid[pacY][pacX]=" "; pacScore+=10; pacDots--; }
  else if(cell==="o"){ pacGrid[pacY][pacX]=" "; pacScore+=50; pacDots--; pacPoder=true; pacPoderHasta=Date.now()+6000; }
  if(pacPoder && Date.now()>pacPoderHasta) pacPoder=false;

  pacGhosts.forEach(g=>{
    const dirs=[{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}].filter(d=>pacLibre(g.x+d.x,g.y+d.y));
    if(dirs.length){
      const d = dirs[Math.floor(Math.random()*dirs.length)];
      g.x = (g.x+d.x+PAC_COLS)%PAC_COLS;
      g.y = g.y+d.y;
    }
  });

  pacGhosts.forEach(g=>{
    if(g.x===pacX && g.y===pacY){
      if(pacPoder){ g.x=8; g.y=5; pacScore+=200; }
      else if(!pacFin){
        pacFin=true;
        document.getElementById("pacMsg").textContent="Perdiste — puntos: "+pacScore;
        clearInterval(pacIntervalo);
      }
    }
  });

  if(pacDots<=0 && !pacFin){
    pacFin=true;
    document.getElementById("pacMsg").textContent="Ganaste! puntos: "+pacScore;
    clearInterval(pacIntervalo);
  }

  document.getElementById("pacScore").textContent="Puntos: "+pacScore;
  pacPintar();
}

function pacPintar(){
  const el = document.getElementById("pacGrid");
  el.innerHTML="";
  el.style.gridTemplateColumns = "repeat("+PAC_COLS+",16px)";
  el.style.gridTemplateRows = "repeat("+PAC_ROWS+",16px)";
  for(let y=0;y<PAC_ROWS;y++){
    for(let x=0;x<PAC_COLS;x++){
      const d = document.createElement("div");
      d.className="pac-cell";
      const c = pacGrid[y][x];
      if(c==="#") d.classList.add("wall");
      else if(c===".") d.innerHTML='<span class="pac-dot"></span>';
      else if(c==="o") d.innerHTML='<span class="pac-power"></span>';
      const g = pacGhosts.find(gg=>gg.x===x&&gg.y===y);
      if(x===pacX && y===pacY){
        d.innerHTML = '<span class="pac-man">&#9679;</span>';
      } else if(g){
        d.innerHTML = '<span class="pac-ghost" style="color:'+(pacPoder?"#7c9cc4":g.color)+'">&#128123;</span>';
      }
      el.appendChild(d);
    }
  }
}

const MS_N = 9, MS_MINAS = 10;
let msTablero, msRev, msBand, msFin, msIntervalo, msSeg;

function msAbrir(){
  document.getElementById("msModal").classList.add("open");
  msIniciar();
}
function msCerrar(){
  clearInterval(msIntervalo);
  document.getElementById("msModal").classList.remove("open");
}
document.getElementById("msClose").addEventListener("click", msCerrar);
document.getElementById("msModal").addEventListener("click", e=>{
  if(e.target.id === "msModal") msCerrar();
});
document.getElementById("msReset").addEventListener("click", msIniciar);

function msIniciar(){
  clearInterval(msIntervalo);
  msSeg = 0;
  msFin = false;
  document.getElementById("msTimer").textContent = "⏱ 0";
  document.getElementById("msReset").textContent = "🙂";
  document.getElementById("msMinas").textContent = "🚩 " + MS_MINAS;
  msTablero = Array.from({length:MS_N},()=>Array(MS_N).fill(0));
  msRev = Array.from({length:MS_N},()=>Array(MS_N).fill(false));
  msBand = Array.from({length:MS_N},()=>Array(MS_N).fill(false));
  let colocadas = 0;
  while(colocadas < MS_MINAS){
    const x = Math.floor(Math.random()*MS_N), y = Math.floor(Math.random()*MS_N);
    if(msTablero[y][x] !== "M"){ msTablero[y][x] = "M"; colocadas++; }
  }
  for(let y=0;y<MS_N;y++) for(let x=0;x<MS_N;x++){
    if(msTablero[y][x]==="M") continue;
    let cnt=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const ny=y+dy, nx=x+dx;
      if(ny>=0&&ny<MS_N&&nx>=0&&nx<MS_N&&msTablero[ny][nx]==="M") cnt++;
    }
    msTablero[y][x]=cnt;
  }
  msPintar();
  msIntervalo = setInterval(()=>{
    msSeg++;
    document.getElementById("msTimer").textContent = "⏱ " + msSeg;
  }, 1000);
}

function msPintar(){
  const grid = document.getElementById("msGrid");
  grid.innerHTML = "";
  for(let y=0;y<MS_N;y++){
    for(let x=0;x<MS_N;x++){
      const celda = document.createElement("div");
      celda.className = "ms-cell";
      if(msRev[y][x]){
        celda.classList.add("revealed");
        if(msTablero[y][x]==="M"){ celda.classList.add("mine"); celda.textContent="💣"; }
        else if(msTablero[y][x]>0){ celda.textContent=msTablero[y][x]; celda.classList.add("n"+msTablero[y][x]); }
      } else if(msBand[y][x]){
        celda.textContent="🚩";
      }
      celda.addEventListener("click", ()=>msClic(x,y));
      celda.addEventListener("contextmenu", (e)=>{ e.preventDefault(); msMarcar(x,y); });
      grid.appendChild(celda);
    }
  }
}

function msClic(x,y){
  if(msFin || msRev[y][x] || msBand[y][x]) return;
  if(msTablero[y][x]==="M"){
    for(let yy=0;yy<MS_N;yy++) for(let xx=0;xx<MS_N;xx++) if(msTablero[yy][xx]==="M") msRev[yy][xx]=true;
    msFin = true;
    clearInterval(msIntervalo);
    document.getElementById("msReset").textContent = "😵";
    msPintar();
    return;
  }
  msRevelar(x,y);
  msPintar();
  msChequearVictoria();
}

function msRevelar(x,y){
  if(x<0||x>=MS_N||y<0||y>=MS_N||msRev[y][x]||msBand[y][x]) return;
  msRev[y][x]=true;
  if(msTablero[y][x]===0){
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(dx||dy) msRevelar(x+dx,y+dy);
  }
}

function msMarcar(x,y){
  if(msFin || msRev[y][x]) return;
  msBand[y][x] = !msBand[y][x];
  let usadas = 0;
  for(let yy=0;yy<MS_N;yy++) for(let xx=0;xx<MS_N;xx++) if(msBand[yy][xx]) usadas++;
  document.getElementById("msMinas").textContent = "🚩 " + (MS_MINAS - usadas);
  msPintar();
}

function msChequearVictoria(){
  let reveladas = 0;
  for(let y=0;y<MS_N;y++) for(let x=0;x<MS_N;x++) if(msRev[y][x]) reveladas++;
  if(reveladas === MS_N*MS_N - MS_MINAS){
    msFin = true;
    clearInterval(msIntervalo);
    document.getElementById("msReset").textContent = "😎";
  }
}

render();
// auto-refresco de la pagina cada 2 min (igual que la frecuencia de publicacion)
setTimeout(()=>location.reload(), 2*60*1000);
</script>
